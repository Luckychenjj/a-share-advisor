[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xiao-a-advisor"
version = "0.1.0"
description = "Evidence-driven and replaceable A-share advisor core"
requires-python = ">=3.11"

[project.optional-dependencies]
fallback-data = ["baostock", "pytdx"]

[project.scripts]
xiao-a = "xiao_a.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"xiao_a.web" = ["*.html", "*.js", "*_LICENSE.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
